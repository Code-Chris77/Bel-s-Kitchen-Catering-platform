name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Create local secrets for the test run
        run: |
          cat > .dev.vars <<'EOF'
          KITCHEN_PASSWORD=kitchen-test-pass
          KITCHEN_SESSION_SECRET=test-secret-kitchen-0123456789abcdef
          ADMIN_EMAIL=admin@example.com
          ADMIN_PASSWORD=admin-test-pass
          ADMIN_SESSION_SECRET=test-secret-admin-0123456789abcdef
          EOF
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
